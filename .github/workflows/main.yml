name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@v1
    with:
      coverage: codecov
      envs: |
        - linux: py311-test-oldestdeps
        - linux: py312-test
        - macos: py313-test
        - windows: py313-test
        - linux: py313-test-devdeps
  publish:
    needs: tests
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/publish_pure_python.yml@v3
    with:
      test_extras: test
      test_command: pytest --pyargs sedfitter
    secrets:
      pypi_token: ${{ secrets.pypi_token }}
