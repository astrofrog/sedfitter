[tox]
envlist =
    py{311,312,313}-test
    codestyle
requires =
    setuptools >= 30.3.0
    pip >= 19.3.1
isolated_build = true

[testenv]
setenv =
    MPLBACKEND=agg
    devdeps: PIP_EXTRA_INDEX_URL = https://pypi.anaconda.org/astropy/simple https://pypi.anaconda.org/liberfa/simple https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
changedir = .tmp/{envname}

description =
    run tests
    cov: and test coverage

deps =
    cov: coverage
    oldestdeps: numpy==1.23.*
    oldestdeps: scipy==1.9.*
    oldestdeps: matplotlib==3.6.*
    oldestdeps: astropy==5.2.*
    devdeps: numpy>=0.0.dev0
    devdeps: scipy>=0.0.dev0
    devdeps: matplotlib>=0.0.dev0
    devdeps: astropy>=0.0.dev0

extras =
    test

commands =
    pip freeze
    pytest --pyargs sedfitter {toxinidir}/docs --cov sedfitter --cov-config={toxinidir}/pyproject.toml -n auto {posargs}

[testenv:codestyle]
skip_install = true
changedir = .
description = check code style, e.g. with flake8
deps = flake8
commands = flake8 sedfitter --count --max-line-length=100

[testenv:build_docs]
changedir = docs
description = invoke sphinx-build to build the HTML docs
extras = docs
commands =
    pip freeze
    sphinx-build -W -b html . _build/html
